# 代跑 rustfmt 並把格式化結果提交回分支（沙盒無 Rust 環境，runner 是唯一 fmt 來源）
name: Format

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt --all
        run: cargo fmt --all

      - name: Commit formatted files (if any)
        run: |
          if [ -n "$(git status --porcelain -- '*.rs')" ]; then
            git config user.name "arena-ai-coding-agent[bot]"
            git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style: cargo fmt"
            git push
          else
            echo "already formatted"
          fi
