# Web CI/CD：PR → 建置＋測試；merge main → 部署 GitHub Pages → 線上煙測 → 失敗開 issue
name: Web CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install wasm-bindgen-cli (GitHub releases, version-pinned)
        run: |
          mkdir -p /tmp/wb && cd /tmp/wb
          curl -sSfL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.100/wasm-bindgen-0.2.100-x86_64-unknown-linux-musl.tar.gz | tar xz
          BIN_DIR="$(find . -type f -name wasm-bindgen | head -1 | xargs dirname)"
          sudo install -m755 "$BIN_DIR/wasm-bindgen" /usr/local/bin/
          sudo install -m755 "$BIN_DIR/wasm-bindgen-test-runner" /usr/local/bin/ 2>/dev/null || true
          wasm-bindgen --version

      - name: Build wasm bindings
        run: ./scripts/build-wasm.sh

      - name: Install npm dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Unit tests (vitest, runs wasm in Node)
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Smoke test deployed site (retry x2)
        id: smoke
        working-directory: web
        run: |
          ok=0
          for i in 1 2; do
            echo "::group::attempt $i"
            if SMOKE_URL="${{ needs.deploy.outputs.url }}" npx playwright test --project=chromium; then
              ok=1
            fi
            echo "::endgroup::"
            [ "$ok" = "1" ] && break
          done
          exit $((1 - ok))

      - name: Open issue on smoke failure (closed-loop feedback)
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA7="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          URL="${{ needs.deploy.outputs.url }}"
          BODY="部署後線上煙測失敗（重試 2 次皆失敗）。\n\n- 線上網址：${URL}\n- 執行紀錄：${RUN_URL}\n- Commit：${SHA7}\n\n請檢查最近一次部署；必要時回滾至 last-good commit。"
          gh issue create --title "🚨 線上煙測失敗 @ ${SHA7}" --body "$BODY" || \
            gh issue create --title "線上煙測失敗 @ ${SHA7}" --body "$BODY"
